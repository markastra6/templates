name: Accessibility audit

on:
  workflow_dispatch:
    inputs:
      url:
        description: Public HTTPS page URL to audit
        required: true
        type: string

permissions:
  contents: read

jobs:
  pa11y:
    name: Audit page accessibility
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          package-manager-cache: false
      - name: Validate target URL
        env:
          TARGET_URL: ${{ inputs.url }}
        run: python scripts/validate_public_url.py "$TARGET_URL"
      - name: Prepare audit CLI outside the browser namespace
        env:
          PUPPETEER_SKIP_DOWNLOAD: "true"
        run: npm install --prefix "$RUNNER_TEMP/audit-tools" --ignore-scripts --no-fund --no-audit pa11y-ci@5.0.0
      - name: Audit in a restricted network namespace
        env:
          TARGET_URL: ${{ inputs.url }}
          AUDIT_HOST: ${{ vars.AUDIT_HOST || format('{0}.github.io', github.repository_owner) }}
        run: bash scripts/run_isolated_audit.sh pa11y
