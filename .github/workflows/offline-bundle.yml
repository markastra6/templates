name: Build verified offline workbench

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  offline:
    name: Offline ZIP package
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          package-manager-cache: false
      - name: Build complete workbench
        run: |
          npm ci --no-fund
          npm run build
      - name: Package and verify offline archive
        run: |
          python3 scripts/package_offline.py
          python3 -m zipfile -t dist/ui-workbench-offline.zip
      - uses: actions/upload-artifact@v4
        with:
          name: ui-workbench-offline
          path: dist/ui-workbench-offline.zip
          if-no-files-found: error
          retention-days: 14
