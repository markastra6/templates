name: Repository validation

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: repository-validation-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7
        with:
          python-version: "3.12"
      - name: Validate MCP and environment configuration
        run: python scripts/validate_repo.py
      - name: Test public audit URL validation
        run: python -m unittest discover -s tests -v
      - name: Validate toolkit installer syntax
        run: |
          bash -n scripts/setup-agent-toolkit.sh
          bash -n scripts/run_isolated_audit.sh
      - name: Prove external audit isolation with a local TLS fixture
        run: bash tests/audit-network-smoke.sh
      - name: Install actionlint
        env:
          ACTIONLINT_VERSION: "1.7.12"
          ACTIONLINT_SHA256: "8aca8db96f1b94770f1b0d72b6dddcb1ebb8123cb3712530b08cc387b349a3d8"
        run: |
          archive="$RUNNER_TEMP/actionlint.tar.gz"
          curl -fsSLo "$archive" "https://github.com/rhysd/actionlint/releases/download/v${ACTIONLINT_VERSION}/actionlint_${ACTIONLINT_VERSION}_linux_amd64.tar.gz"
          echo "${ACTIONLINT_SHA256}  ${archive}" | sha256sum --check
          tar -xzf "$archive" -C "$RUNNER_TEMP" actionlint
          echo "$RUNNER_TEMP" >> "$GITHUB_PATH"
      - name: Lint GitHub Actions workflows
        run: actionlint -color
      - name: Check patch whitespace
        env:
          EVENT_NAME: ${{ github.event_name }}
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          PUSH_BASE_SHA: ${{ github.event.before }}
        shell: bash
        run: |
          if [ "$EVENT_NAME" = "pull_request" ]; then
            git diff --check "${PR_BASE_SHA}...HEAD"
          elif [ "$EVENT_NAME" = "push" ]; then
            if [[ "$PUSH_BASE_SHA" =~ ^0+$ ]]; then
              if git rev-parse --verify HEAD^ >/dev/null 2>&1; then
                git diff --check HEAD^ HEAD
              else
                echo "Initial commit; no parent diff to check."
              fi
            else
              git diff --check "${PUSH_BASE_SHA}...HEAD"
            fi
          else
            echo "Manual run: checking the latest commit."
            if git rev-parse --verify HEAD^ >/dev/null 2>&1; then
              git diff --check HEAD^ HEAD
            else
              echo "No parent commit; no diff to check."
            fi
          fi
