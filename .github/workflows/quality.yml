name: Quality checks

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: quality-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  markdown:
    name: Markdown lint
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Lint Markdown
        run: npx --yes markdownlint-cli2@0.24.0 "**/*.md"

  node:
    name: Node.js checks and dependency audit
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Detect Node.js project
        id: detect
        shell: bash
        run: |
          if [ -f package.json ]; then
            echo "present=true" >> "$GITHUB_OUTPUT"
          else
            echo "present=false" >> "$GITHUB_OUTPUT"
            echo "No package.json yet; Node.js checks will be enabled when the app scaffold is added."
          fi
      - name: Set up Node.js
        if: steps.detect.outputs.present == 'true'
        uses: actions/setup-node@v7
        with:
          node-version: 24
          package-manager-cache: false
      - name: Install locked dependencies
        if: steps.detect.outputs.present == 'true'
        run: |
          if [ ! -f package-lock.json ]; then
            echo "Commit package-lock.json before enabling CI installs." >&2
            exit 1
          fi
          npm ci --no-fund
      - name: Audit dependencies
        if: steps.detect.outputs.present == 'true'
        run: npm audit --audit-level=high
      - name: Audit the optional agent tools lockfile
        run: npm audit --prefix tools/agent --audit-level=high
      - name: Run required project checks
        if: steps.detect.outputs.present == 'true'
        run: |
          npm run lint
          npm run typecheck
          npm run test
          npm run build
