name: Lighthouse audit

on:
  workflow_dispatch:
    inputs:
      url:
        description: Public HTTPS page URL to audit
        required: true
        type: string

permissions:
  contents: read

jobs:
  lighthouse:
    name: Measure performance, accessibility and SEO
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          package-manager-cache: false
      - name: Validate target URL
        env:
          TARGET_URL: ${{ inputs.url }}
        run: python scripts/validate_public_url.py "$TARGET_URL"
      - name: Prepare audit CLI outside the browser namespace
        env:
          PUPPETEER_SKIP_DOWNLOAD: "true"
        run: npm install --prefix "$RUNNER_TEMP/audit-tools" --ignore-scripts --no-fund --no-audit lighthouse@13.3.0
      - name: Audit in a restricted network namespace
        env:
          TARGET_URL: ${{ inputs.url }}
          AUDIT_HOST: ${{ vars.AUDIT_HOST || format('{0}.github.io', github.repository_owner) }}
        run: bash scripts/run_isolated_audit.sh lighthouse
      - name: Save Lighthouse report
        if: ${{ !cancelled() && hashFiles('lighthouse.report.*') != '' }}
        uses: actions/upload-artifact@v7
        with:
          name: lighthouse-report
          path: lighthouse.report.*
          if-no-files-found: error
          retention-days: 3
