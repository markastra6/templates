name: CodeQL

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: "23 4 * * 1"

permissions:
  contents: read

jobs:
  detect:
    name: Detect supported source
    permissions:
      contents: read
    runs-on: ubuntu-latest
    outputs:
      has_source: ${{ steps.scan.outputs.has_source }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Detect JavaScript or TypeScript
        id: scan
        shell: bash
        run: |
          pattern='\.(js|jsx|ts|tsx|mjs|cjs)$'
          for extension in js jsx ts tsx mjs cjs; do
            if ! printf 'codeql-probe.%s\n' "$extension" | grep -Eq "$pattern"; then
              echo "CodeQL source-detection pattern failed for .$extension" >&2
              exit 1
            fi
          done

          if git ls-files | grep -E "$pattern" > /dev/null; then
            echo "has_source=true" >> "$GITHUB_OUTPUT"
          else
            echo "has_source=false" >> "$GITHUB_OUTPUT"
            echo "No JavaScript/TypeScript source yet; CodeQL will start after the app is added."
          fi

  analyze-python:
    name: Analyze Python
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
      security-events: write
    timeout-minutes: 30
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Initialize CodeQL
        uses: github/codeql-action/init@v4
        with:
          languages: python
          build-mode: none
      - name: Perform CodeQL analysis
        uses: github/codeql-action/analyze@v4

  analyze:
    name: Analyze JavaScript and TypeScript
    needs: detect
    if: needs.detect.outputs.has_source == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
      security-events: write
    timeout-minutes: 30
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Initialize CodeQL
        uses: github/codeql-action/init@v4
        with:
          languages: javascript-typescript
          build-mode: none
      - name: Perform CodeQL analysis
        uses: github/codeql-action/analyze@v4
